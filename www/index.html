<html lang="fr">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>
:root{
  --bg:#0E1417; --surf:#151E23; --surf2:#1C272D; --line:#2B3940;
  --brass:#C9972F; --text:#E4E9EB; --mute:#8797A0; --red:#CF5A45; --green:#6FA98B;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;overscroll-behavior:none}
#app{display:flex;flex-direction:column;height:100dvh}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;
  padding-top:calc(12px + env(safe-area-inset-top));background:var(--surf);border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:16px;font-weight:600}
header .sub{font-size:11px;color:var(--mute);font-family:var(--mono);margin-top:2px}
main{flex:1;overflow-y:auto;padding:12px 16px 96px;-webkit-overflow-scrolling:touch}
nav{display:flex;background:var(--surf);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:14px 0;background:none;border:none;border-top:2px solid transparent;
  color:var(--mute);font-size:13px;font-family:var(--sans)}
nav button.on{color:var(--brass);font-weight:600;border-top-color:var(--brass)}

button,select,input,textarea{font-family:var(--sans);font-size:15px}
.btn{border-radius:10px;padding:11px 16px;background:none;border:1px solid var(--line);color:var(--text);font-weight:500}
.btn.p{background:var(--brass);border-color:var(--brass);color:#0E1417;font-weight:600}
.btn.d{border-color:var(--red);color:var(--red)}
.btn.s{padding:7px 12px;font-size:13px}
.btn.full{width:100%}

label.lb{display:block;margin-bottom:4px;font-size:12px;color:var(--mute)}
.fld{display:flex;align-items:center;background:var(--surf2);border:1px solid var(--line);border-radius:10px;padding:0 12px}
.fld input{flex:1;min-width:0;background:none;border:none;outline:none;color:var(--text);padding:11px 0}
.fld input.mono{font-family:var(--mono)}
.fld .sfx{padding-left:8px;color:var(--mute);font-family:var(--mono);font-size:13px}
select.sel{width:100%;background:var(--surf2);border:1px solid var(--line);border-radius:10px;
  padding:11px 12px;color:var(--text);outline:none;appearance:none}
select.sel option{background:var(--surf2);color:var(--text)}
textarea{width:100%;background:var(--surf2);border:1px solid var(--line);border-radius:10px;
  padding:12px;color:var(--text);outline:none;resize:vertical;font-size:14px}

.row{display:grid;gap:12px;grid-template-columns:1fr 1fr}
.row3{display:grid;gap:12px;grid-template-columns:1fr 1fr 1fr}
.mt{margin-top:12px}
.rule{display:flex;align-items:center;gap:12px;margin:26px 0 12px}
.rule span{color:var(--brass);font-size:13px;font-weight:600}
.rule i{flex:1;height:1px;background:var(--line)}

.card{display:block;width:100%;text-align:left;background:var(--surf);border:1px solid var(--line);
  border-radius:12px;padding:13px;margin-bottom:8px;color:var(--text)}
.card .t{display:flex;justify-content:space-between;align-items:baseline}
.card .t b{font-size:15px;font-weight:600}
.card .t em{font-style:normal;font-size:12px;color:var(--mute);font-family:var(--mono)}
.card .sub{margin-top:3px;font-size:12.5px;color:var(--mute);line-height:1.5}
.card .data{margin-top:8px;font-family:var(--mono);font-size:12.5px;display:flex;flex-wrap:wrap;gap:4px 18px}
.card .data k{color:var(--mute)}
.card .warn{margin-top:8px;font-size:11.5px;color:var(--red)}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border-radius:10px;padding:9px 12px;background:none;border:1px solid var(--line);
  color:var(--text);font-family:var(--mono);font-size:13px;font-weight:600}
.chip.on{background:var(--brass);border-color:var(--brass);color:#0E1417}
.chip.txt{font-family:var(--sans);font-size:12.5px;font-weight:400;color:var(--mute)}
.chip.txt.on{background:var(--red);border-color:var(--red);color:#0E1417;font-weight:600}
.chip.v{background:var(--surf2)}

.readout{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:14px}
.readout .big{font-family:var(--mono);font-size:38px;color:var(--brass);line-height:1}
.readout .big u{text-decoration:none;font-size:15px;color:var(--mute)}
.readout .sm{margin-top:12px;display:flex;gap:22px;flex-wrap:wrap;font-family:var(--mono);font-size:13px}
.readout .sm k{color:var(--mute)}

.list{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:14px}
.list div.it{display:flex;justify-content:space-between;align-items:center;
  background:var(--surf);padding:11px 14px;font-size:13.5px;border-top:1px solid var(--line)}
.list div.it:first-child{border-top:none}
.list .tag{color:var(--brass);font-size:11px}
.list .x{background:none;border:none;color:var(--mute);font-size:20px;line-height:1;padding:0 4px}

.empty{margin-top:60px;text-align:center;color:var(--mute);font-size:14px;line-height:1.8}
.menu{position:absolute;right:16px;top:64px;z-index:30;width:230px;background:var(--surf2);
  border:1px solid var(--line);border-radius:10px;padding:6px}
.menu button{display:block;width:100%;text-align:left;background:none;border:none;color:var(--text);
  padding:11px 12px;font-size:14px;border-radius:6px}
.ladder{background:var(--surf);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ladder div{display:flex;justify-content:space-between;padding:10px 16px;font-family:var(--mono);
  font-size:13px;border-top:1px solid var(--line)}
.ladder div:first-child{border-top:none}
.ladder b{color:var(--brass)}
.ladder span{color:var(--mute)}
.scroll-x{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.scroll-x button{white-space:nowrap}
.foot{display:flex;gap:12px;margin:24px 0 16px}
.chip.sel{background:var(--brass);border-color:var(--brass);color:#0E1417;font-weight:600}
.badge{display:inline-block;padding:3px 9px;border-radius:6px;font-size:11px;font-weight:600}
.badge.u{background:#243038;color:var(--text)}
.badge.h{background:var(--brass);color:#0E1417}
.jauge{height:9px;border-radius:5px;background:var(--surf2);border:1px solid var(--line);overflow:hidden;margin-top:10px}
.jauge i{display:block;height:100%}
.alerte{margin-top:12px;padding:11px 13px;border-radius:10px;background:#2A1714;
  border:1px solid var(--red);color:var(--red);font-size:12.5px;line-height:1.5}
.avert{margin-top:12px;padding:11px 13px;border-radius:10px;background:#221B0E;
  border:1px solid var(--brassDim,#7A5E20);color:var(--brass);font-size:12.5px;line-height:1.5}
.lien{background:none;border:none;color:var(--brass);font-size:11.5px;text-decoration:underline;padding:0 0 0 4px}
</style>
</head>

/* =================== CALCULS =================== */
const MOA100=29.089;
function stats(v){v=(v||[]).filter(x=>typeof x==="number"&&!isNaN(x));if(!v.length)return null;
  const n=v.length,moy=v.reduce((a,b)=>a+b,0)/n,mn=Math.min(...v),mx=Math.max(...v);
  const sd=n>1?Math.sqrt(v.reduce((a,b)=>a+(b-moy)**2,0)/(n-1)):0;
  return{n,moy,es:mx-mn,sd,cv:moy?sd/moy*100:0}}
const toMOA=(mm,d)=>(!mm||!d?null:mm/(MOA100*(d/100)));
const toMIL=(mm,d)=>(!mm||!d?null:mm/d);
const f=(x,n=1)=>(x==null||isNaN(x)?"—":Number(x).toFixed(n));
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* =================== ÉVÉNEMENTS =================== */
document.addEventListener("input",e=>{
  const k=e.target.dataset.f;if(!k)return;
  const v=e.target.value;
  if(k==="baseQ"){ui.baseQ=v;const m=document.querySelector(".list");
    const all=L[ui.baseCat](),items=all.filter(x=>x.toLowerCase().includes(v.toLowerCase())),perso=db.perso[ui.baseCat]||[];
    if(m)m.innerHTML=items.slice(0,500).map(x=>`<div class="it"><span>${esc(x)}${perso.includes(x)?' <span class="tag">· ajoutée</span>':""}</span>
      ${perso.includes(x)?`<button class="x" data-a="delRef" data-v="${esc(x)}">×</button>`:""}</div>`).join("")
      ||`<div class="it" style="justify-content:center;color:var(--mute)">Aucune correspondance. Ajoute-la ci-dessus.</div>`;
    return}
  if(k==="fArme"||k==="fDist"){ui[k]=v;render();return}
  if(k.startsWith("_"))return;
  if(!draft)return;
  draft[k]=v;
  if(k==="recetteId"){const r=db.recettes.find(x=>x.id===v);
    if(r){draft.poudre=draft.poudre||r.poudre||"";draft.col=draft.col||r.col||"";render()}return}
  if(k==="lunette"){const c=CLIC_MAP[v];if(c)draft.clic=c;render();return}
  if(k==="calibre"&&ui.route&&ui.route.t==="recette"){const c=COTES[v];
    if(c){if(c[0]&&!draft.longEtui)draft.longEtui=String(c[0]);if(!draft.colMax)draft.colMax=String(c[1])}
    draft.marqueMun="";render();return}
  if(k==="modele"&&!draft.nom){draft.nom=v;render();return}
  if(k==="groupe"||k==="distance"){patchDerived()}
});

function patchDerived(){
  const t=draft;if(!t)return;
  const el=document.querySelectorAll(".row span");
  const moa=toMOA(+t.groupe,+t.distance),mil=toMIL(+t.groupe,+t.distance);
  const box=document.querySelector('[data-f="groupe"]')?.closest(".row")?.lastElementChild;
  if(box)box.innerHTML=`<span><k style="color:var(--mute)">MOA </k>${f(moa,2)}</span><span><k style="color:var(--mute)">MIL </k>${f(mil,2)}</span>`;
}

document.addEventListener("click",e=>{
  const b=e.target.closest("[data-a]");
  if(!b){if(ui.menu){ui.menu=false;render()}return}
  const a=b.dataset.a,v=b.dataset.v;
  const get=k=>document.querySelector(`[data-f="${k}"]`)?.value||"";
  const pull=()=>{document.querySelectorAll("[data-f]").forEach(el=>{
    const k=el.dataset.f;if(k&&!k.startsWith("_")&&draft)draft[k]=el.value})};

  switch(a){
    case "menu":ui.menu=!ui.menu;break;
    case "tab":ui.tab=v;ui.menu=false;break;
    case "close":ui.route=null;draft=null;break;
    case "baseCat":ui.baseCat=v;ui.baseQ="";break;

    case "newTir":draft={id:uid(),date:new Date().toISOString().slice(0,10),armeId:db.armes[0]?.id||"",
      recetteId:"",poudre:"",charge:"",col:"",cbto:"",distance:"",vitesses:[],groupe:"",temp:"",vent:"",
      ventDir:"",pAtm:"",hygro:"",alt:"",notes:"",pression:[]};ui.route={t:"tir"};break;
    case "openTir":draft={...db.tirs.find(x=>x.id===v),_exist:1};ui.route={t:"tir"};break;
    case "dist":pull();draft.distance=v;break;
    case "addV":{const nums=get("_v").split(/[\s,;]+/).map(x=>parseFloat(x.replace(",",".")))
      .filter(x=>!isNaN(x));pull();if(nums.length)draft.vitesses=[...draft.vitesses,...nums];break}
    case "delV":pull();draft.vitesses=draft.vitesses.filter((_,i)=>i!==+v);break;
    case "sig":pull();draft.pression=(draft.pression||[]).includes(v)
      ?draft.pression.filter(x=>x!==v):[...(draft.pression||[]),v];break;
    case "saveTir":{pull();const t={...draft};delete t._exist;
      db.tirs=draft._exist?db.tirs.map(x=>x.id===t.id?t:x):[...db.tirs,t];save();ui.route=null;draft=null;break}
    case "delTir":if(confirm("Supprimer ce tir ?")){db.tirs=db.tirs.filter(x=>x.id!==draft.id);save();ui.route=null;draft=null}break;

    case "newRec":draft={id:uid(),type:"recharge",nom:"",calibre:"",projectile:"",poidsOgive:"",longOgive:"",
      diam:"",poudre:"",chargeRef:"",lotPoudre:"",etui:"",etuiNeuf:true,etuiTirs:"",longEtui:"",colMax:"",
      volume:"",recuits:"",tension:"",amorce:"",marqueMun:"",refMun:"",v0Annoncee:"",lot:"",prix:"",parBoite:"",
      col:"",cbto:"",saut:"",assise:"",sertissage:"",notes:""};ui.route={t:"recette"};break;
    case "openRec":draft={...db.recettes.find(x=>x.id===v),_exist:1};ui.route={t:"recette"};break;
    case "munType":pull();draft.type=v;break;
    case "etuiType":pull();draft.etuiNeuf=(v==="neuf");if(v==="neuf")draft.etuiTirs="";break;
    case "etuiPlus":{pull();
      if(v==="reset"){draft.etuiTirs="";draft.etuiNeuf=true;break}
      const n=Math.max(0,Math.min(MAX_TIRS,(+draft.etuiTirs||0)+(+v)));draft.etuiTirs=String(n);break}
    case "cotes":{pull();const c=COTES[draft.calibre];
      if(c){if(c[0])draft.longEtui=String(c[0]);draft.colMax=String(c[1])}break}
    case "assise":{pull();
      const a2=(+draft.longOgive)+(+draft.longEtui)-(+draft.col);
      if(!isNaN(a2))draft.assise=a2.toFixed(2);break}
    case "saveRec":{pull();const r={...draft};delete r._exist;
      db.recettes=draft._exist?db.recettes.map(x=>x.id===r.id?r:x):[...db.recettes,r];save();ui.route=null;draft=null;break}
    case "delRec":if(confirm("Supprimer cette recette ?")){db.recettes=db.recettes.filter(x=>x.id!==draft.id);save();ui.route=null;draft=null}break;

    case "newArme":draft={id:uid(),nom:"",modele:"",type:"Verrou (bolt action)",calibre:"",canon:"",pas:"",
      lunette:"",clic:"0.1 MIL",coupsInit:"",notes:""};ui.route={t:"arme"};break;
    case "openArme":draft={...db.armes.find(x=>x.id===v),_exist:1};ui.route={t:"arme"};break;
    case "saveArme":{pull();const w={...draft};delete w._exist;if(!w.nom)w.nom=w.modele||"Sans nom";
      db.armes=draft._exist?db.armes.map(x=>x.id===w.id?w:x):[...db.armes,w];save();ui.route=null;draft=null;break}
    case "delArme":if(confirm("Supprimer cette arme ?")){db.armes=db.armes.filter(x=>x.id!==draft.id);save();ui.route=null;draft=null}break;

    case "addRef":{const n=get("_new").trim();if(n){db.perso[ui.baseCat]=[...(db.perso[ui.baseCat]||[]),n];save()}break}
    case "delRef":db.perso[ui.baseCat]=db.perso[ui.baseCat].filter(x=>x!==v);save();break;

    case "expJson":dl(JSON.stringify(db,null,2),"carnet-de-tir-"+today()+".json","application/json");ui.menu=false;break;
    case "expCsv":{const head=["date","arme","recette","poudre","charge_gr","distance_m","coups","v0_moy","es","sd","groupe_mm","moa","temp_c","notes"];
      const rows=db.tirs.map(t=>{const s=stats(t.vitesses),r=db.recettes.find(x=>x.id===t.recetteId),
        w=db.armes.find(x=>x.id===t.armeId);
        return [t.date,w?.nom||"",r?.nom||"",t.poudre||"",t.charge||"",t.distance||"",(t.vitesses||[]).length,
          s?s.moy.toFixed(1):"",s?s.es.toFixed(1):"",s?s.sd.toFixed(1):"",t.groupe||"",
          f(toMOA(+t.groupe,+t.distance),2),t.temp||"",(t.notes||"").replace(/[\n;]/g," ")].join(";")});
      dl([head.join(";"),...rows].join("\n"),"tirs-"+today()+".csv","text/csv");ui.menu=false;break}
    case "imp":{const i=document.createElement("input");i.type="file";i.accept=".json";
      i.onchange=()=>{const fl=i.files[0];if(!fl)return;const rd=new FileReader();
        rd.onload=()=>{try{const d=JSON.parse(rd.result);db={...EMPTY,...d,perso:{...EMPTY.perso,...(d.perso||{})}};
          save();render()}catch(x){alert("Fichier illisible : ce n'est pas un export du carnet.")}};
        rd.readAsText(fl)};i.click();ui.menu=false;break}
    default:return;
  }
  render();
});

const today=()=>new Date().toISOString().slice(0,10);
function dl(txt,name,mime){
  const b=new Blob([txt],{type:mime}),u=URL.createObjectURL(b),a=document.createElement("a");
  a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);
}
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))
  navigator.serviceWorker.register("sw.js").catch(()=>{});
render();
</script>
</body>
</html>
