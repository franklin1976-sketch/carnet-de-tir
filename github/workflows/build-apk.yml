name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Inventaire des fichiers recus
        run: |
          echo "--- racine ---"; ls -la
          echo "--- www ---"; ls -la www || echo "DOSSIER www ABSENT"
          echo "--- resources ---"; ls -la resources || echo "pas de dossier resources"

      - name: Ranger les fichiers au bon endroit
        shell: bash
        run: |
          set +e
          mkdir -p www resources
          # un .html depose a la racine ECRASE toujours www/index.html
          racine=$(ls -1 *.html 2>/dev/null | head -1)
          if [ -n "$racine" ]; then
            cp -f "$racine" www/index.html
            echo "racine : $racine -> www/index.html (ecrasement)"
          fi
          # sinon, un .html au nom different dans www/ devient index.html
          if [ ! -f www/index.html ]; then
            autre=$(ls -1 www/*.html 2>/dev/null | head -1)
            [ -n "$autre" ] && mv -f "$autre" www/index.html && echo "$autre -> www/index.html"
          fi
          if [ ! -f www/index.html ]; then
            echo "ERREUR : aucun fichier .html dans le depot."
            find . -maxdepth 3 -not -path './.git/*'
            exit 1
          fi
          for x in icon.svg manifest.json sw.js; do
            [ -f "$x" ] && cp -f "$x" www/ && echo "$x -> www/ (ecrasement)"
          done
          if [ -f icon.png ]; then cp -f icon.png resources/icon.png; echo "icon.png -> resources/"; fi
          echo "--- www ---"; ls -la www
          echo "--- resources ---"; ls -la resources
          exit 0

      - name: Verifier la version compilee
        shell: bash
        run: |
          echo "empreinte : $(md5sum www/index.html | cut -d' ' -f1)"
          echo "taille    : $(wc -c < www/index.html) octets"
          v=$(grep -o 'const VERSION="[^"]*"' www/index.html | head -1)
          echo "version   : ${v:-AUCUNE}"
          echo "Hawke     : $(grep -o 'Hawke' www/index.html | wc -l) occurrences"
          echo "Glock     : $(grep -o 'Glock' www/index.html | wc -l) occurrences"
          if [ -z "$v" ]; then
            echo ""
            echo "ARRET : ce fichier ne contient pas de numero de version."
            echo "C'est une ancienne version de l'application."
            echo "Depose le dernier carnet-de-tir.html a la RACINE du depot, puis relance."
            exit 1
          fi

      - name: Ecrire la configuration Capacitor
        run: |
          node -e "require('fs').writeFileSync('package.json', JSON.stringify({name:'carnet-de-tir',version:'1.0.0',private:true},null,2))"
          node -e "require('fs').writeFileSync('capacitor.config.json', JSON.stringify({appId:'fr.carnetdetir.app',appName:'Carnet de tir',webDir:'www',android:{backgroundColor:'#0E1417'}},null,2))"
          cat package.json capacitor.config.json

      - name: Installer Capacitor
        run: npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6

      - name: Ajouter la plateforme Android
        run: npx cap add android

      - name: Synchroniser
        run: npx cap sync android

      - name: Generer les icones Android
        shell: bash
        run: |
          if [ -f resources/icon.png ]; then
            npm install @capacitor/assets@3 --no-save
            npx @capacitor/assets generate --android \
              --iconBackgroundColor "#0E1417" --iconBackgroundColorDark "#0E1417"
          else
            echo "resources/icon.png absent : icone Capacitor par defaut conservee"
          fi

      - name: Compiler l'APK de debug
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: carnet-de-tir-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
